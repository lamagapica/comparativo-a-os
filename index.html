<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Comparador de fotos</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <div class="slider-container" id="slider">
      <!-- Imagen Antes (2012) -->
      <img src="2012 04 09.png" alt="Familia 2012" class="img-before">
      <div class="badge badge-before">9 de abril de 2012</div>

      <!-- Imagen Después (1993) -->
      <div class="img-after-wrapper" id="afterWrapper">
        <img src="1993 03 21.png" alt="Padres 1993" class="img-after">
        <div class="badge badge-after">21 de marzo de 1993</div>
      </div>

      <!-- Control de deslizamiento (Handle) -->
      <div class="handle" id="handle">
        <div class="handle-line"></div>
        <div class="handle-button">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
            <path d="M8.5 17l-5-5 5-5v10zm7 0l5-5-5-5v10z"/>
          </svg>
        </div>
        <div class="handle-line"></div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
